<style>

.win.open .curtain{animation:none}

.wxw{position:relative;width:60px;height:60px;margin-top:-6px}.wbk{position:absolute;inset:-16px;border:5px solid #ffcfe1;border-radius:16px;transform:rotate(-9deg);opacity:.75;animation:wob 2.4s ease-in-out infinite alternate}@keyframes wob{to{transform:rotate(-2deg) scale(1.05)}}.wax{position:relative;width:60px;height:60px;border-radius:50%;background:#ffb6d2;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;animation:beat 1.4s infinite}.wax b{color:#ff4fa0;font-size:26px;line-height:1;margin-top:1px}.cur{color:var(--pink);animation:bl .7s steps(1) infinite}@keyframes bl{50%{opacity:0}}

.win.cd{animation:none}.win.cd.out{animation:outa .35s forwards}
canvas{position:fixed;inset:0;z-index:30;pointer-events:none}
.cr8{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:25;white-space:nowrap;font:700 10px 'Space Mono',monospace;letter-spacing:2px;color:var(--ink);background:var(--cream);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:4px 11px;pointer-events:none}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:25;font-size:20px;background:none;border:0;cursor:pointer}

<script>
/* ======= APNA CONTENT YAHAN BADLO ======= */
const CODE="31026";
const GATE_PHOTO="https://i.ibb.co/mrT2Tt79/IMG-20261103-WA0000.jpg";   // <-- pehli screen ki photo ka link yahan daalo: "https://..."
const PHOTOS=["https://i.ibb.co/b5qVcCQc/IMG-20261103-WA0002.jpg","https://i.ibb.co/Ndp4Q60Y/IMG-20261103-WA0003.jpg","https://i.ibb.co/dsS4QH7Q/IMG-20261103-WA0005.jpg0005","https://i.ibb.co/MDsGPD8H/IMG-20261103-WA0004.jpg"];  // <-- gallery ki 4 photos ke links yahan daalo (order mein)
const LETTER=`Raat Ka Hadsa Alok Badshah 👑🦁

Alok Beta Muh Mein Leta 👄😋

500 Dunga To Raat Bhar Lunga 🌚🤤

500 Dunga To Age Se Lunga ✊💦`;
/* ======================================== */
const $=s=>document.querySelector(s),st=$('#stage');
// floating heart outlines
for(let i=0;i<9;i++){const h=document.createElement('div');h.className='fh';h.textContent='♡';h.style.cssText=`left:${Math.random()*95}vw;top:${Math.random()*90}vh;font-size:${18+Math.random()*34}px;animation-delay:${-Math.random()*8}s`;document.body.appendChild(h)}
// ---------- AUDIO ----------
let ac,muted=false,bgOn=false;
const A=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();return ac};
function tn(f,d=.15,type='square',v=.08,t0=0,slide){if(muted)return;const a=A(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
const click=()=>{tn(880,.06,'square',.07);tn(1320,.08,'square',.05,.05)};
const chime=()=>[784,988,1175,1568].forEach((f,i)=>tn(f,.5,'sine',.12,i*.09));
const swoosh=()=>tn(1200,.25,'sawtooth',.05,0,200);
function bgm(){if(bgOn)return;bgOn=true;const n=[523,659,784,659,587,698,880,698,523,659,784,1047,988,784,659,587];let i=0;setInterval(()=>{if(!muted&&ac)tn(n[i++%n.length]/2,.5,'triangle',.05)},420)}
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'};
// ---------- helpers ----------
function win(title,inner,cls=''){st.innerHTML=`<div class="win ${cls}"><div class="tb ${title==='SEAL.EXE'?'seal':''}"><i></i><i></i><i></i><span>${title}</span></div><i class="scr" style="left:6px;top:46px"></i><i class="scr" style="right:6px;top:46px"></i><i class="scr" style="left:6px;bottom:6px"></i><i class="scr" style="right:6px;bottom:6px"></i>${inner}</div>`;return st.firstChild}
function next(fn){const w=st.firstChild;w.classList.add('out');setTimeout(fn,330)}
// ---------- 1. SEAL ----------
function seal(){
 win('SEAL.EXE',`<div class="curtain" id="cu"><div class="rope"></div><div class="knob"></div><svg id="rg" viewBox="0 0 150 150"><circle cx="75" cy="75" r="70"/></svg><div id="hold"><b>❤</b>HOLD ME</div><div class="tag">DON'T LET GO UNTIL IT OPENS!</div></div>`);
 const b=$('#hold'),r=$('#rg circle');let t0=0,raf,osc,g,done=false;const D=2600;
 function dn(e){if(done)return;e.preventDefault();t0=performance.now();b.classList.add('on');const a=A();osc=a.createOscillator();g=a.createGain();osc.type='triangle';osc.frequency.value=110;g.gain.value=muted?0:.07;osc.connect(g);g.connect(a.destination);osc.start();lp()}
 function lp(){const p=Math.min((performance.now()-t0)/D,1);r.style.strokeDashoffset=440*(1-p);osc&&(osc.frequency.value=110+p*420);if(navigator.vibrate&&Math.random()<.08)navigator.vibrate(15);if(p>=1)return fin();raf=requestAnimationFrame(lp)}
 function stop(){try{osc&&osc.stop()}catch(_){}osc=null}
 function up(){if(done)return;cancelAnimationFrame(raf);b.classList.remove('on');stop();r.style.strokeDashoffset=440}
 function fin(){done=true;stop();b.classList.remove('on');chime();navigator.vibrate&&navigator.vibrate([80,40,160]);bgm();
  const cu=$('#cu');cu.style.transition='opacity .7s';cu.style.opacity=0;setTimeout(()=>countdown(3),650)}
 b.addEventListener('mousedown',dn);b.addEventListener('touchstart',dn,{passive:false});
 ['mouseup','mouseleave','touchend','touchcancel'].forEach(n=>b.addEventListener(n,up));
}
// ---------- 2. COUNTDOWN + LOADING ----------
function cdw(h){if(!$('.win.cd'))win('SEAL.EXE','<div class="pad" id="cdp"></div>','cd');$('#cdp').innerHTML=h}
function countdown(n){
 if(n===0){cdw(`<img class="kitty stk3" alt="" src="${(window.STK||{}).kitty||'stickers/hellokitty.jpg'}" onerror="this.onerror=null;this.src='stickers/hellokitty.jpg'"><p class="s" style="color:var(--rose);font-size:14px">Loading your birthday surprise...</p><div class="dots"><i class="a"></i><i class="a"></i><i class="a"></i></div>`);tn(600,.3,'sine',.1,0,1200);return setTimeout(()=>next(party),1700)}
 cdw(`<div class="num">${n}</div><div class="dots">${[3,2,1].map(k=>`<i class="${k>=n?'a':''}"></i>`).join('')}</div>`);
 tn(440+ (3-n)*110,.18,'square',.09);setTimeout(()=>countdown(n-1),950)}
// ---------- 3. PARTY ----------
function party(){
 win('PARTY.EXE',`<div class="pad"><img class="cat stk2" alt="" src="${(window.STK||{}).cat||'stickers/cat-party.jpg'}" onerror="this.onerror=null;this.src='stickers/cat-party.jpg'"><h2>My son was born today!</h2><p class="s">✨ Yes, it's YOU! A little surprise awaits... ✨</p><button class="btn" id="go">🎁 Start the surprise</button></div>`);
 chime();$('#go').onclick=()=>{click();next(cake)}}
// ---------- 4. CAKE ----------
function cake(){
 win('CAKE.EXE',`<div class="pad"><h2 style="font-size:22px">Swipe to Cut the Cake!</h2><span>🎂</span><p class="s">Drag your finger/cursor inside box to slice</p><div id="cakebox"><div class="cakepart" id="c1"><img class="stk1" alt="" draggable="false" src="${(window.STK||{}).cake||'stickers/cake.png'}" onerror="this.onerror=null;this.src='stickers/cake.png'"></div><svg id="slash"></svg></div><div class="pct" id="pc"><span id="pt">0%</span></div></div>`);
 const box=$('#cakebox'),sv=$('#slash'),pc=$('#pc');let dr=false,len=0,last=null,path='',fin=false;
 const pos=e=>{const r=box.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[p.clientX-r.left,p.clientY-r.top]};
 function d(e){e.preventDefault();dr=true;last=pos(e);path=`M${last[0]} ${last[1]}`}
 function m(e){if(!dr||fin)return;e.preventDefault();const p=pos(e);len+=Math.hypot(p[0]-last[0],p[1]-last[1]);last=p;path+=` L${p[0]} ${p[1]}`;sv.innerHTML=`<path d="${path}" stroke="#ff4fa0" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const pct=Math.min(100,Math.round(len/2.2));$('#pt').textContent=pct+'%';pc.style.setProperty('--p',pct);if(Math.random()<.3)tn(500+pct*8,.05,'sine',.04);if(pct>=100)cut()}
 function u(){dr=false}
 function cut(){fin=true;swoosh();chime();petals();const h=$('#c1');h.style.transform='translateX(-8px) rotate(-3deg)';
  $('#cakebox').insertAdjacentHTML('beforeend','');
  setTimeout(()=>{$('.pad h2').textContent='Happy Birthday, My Son! 💦';$('.pad .s').remove();const b=document.createElement('button');b.className='btn';b.textContent='Next →';b.onclick=()=>{click();next(gallery)};$('.pad').appendChild(b)},600)}
 ['mousedown','touchstart'].forEach(n=>box.addEventListener(n,d,{passive:false}));
 ['mousemove','touchmove'].forEach(n=>box.addEventListener(n,m,{passive:false}));
 ['mouseup','mouseleave','touchend'].forEach(n=>box.addEventListener(n,u))}
// ---------- 5. GALLERY ----------
function gallery(){
 const N=PHOTOS.length,emo=['🌸','🧸','🌷','💖','🎀','🫧'];let cur=0;const data=Array.from({length:N},(_,i)=>PHOTOS[i]||null);
 win('GALLERY.EXE',`<div class="pad" style="gap:8px"><h2 style="font-size:22px">My Son 💦</h2><p class="s">Swipe through some beautiful moments</p><div class="car" id="car"></div><div class="pd" id="pd"></div><button class="btn" id="rl">♥ Read Letter →</button></div>`);
 const car=$('#car'),pd=$('#pd');
 data.forEach((u,i)=>{const p=document.createElement('div');p.className='pol';p.innerHTML=`<div class="ph" style="${u?`background-image:url('${u}')`:`background:repeating-linear-gradient(45deg,#ffe3ee 0 10px,#fff1e2 10px 20px)`}"></div><div style="margin-top:6px">IMG_${i+1}.PNG</div>`;
  car.appendChild(p)});
 function ren(){[...car.children].forEach((p,i)=>{const o=i-cur;p.style.transform=`translateX(calc(-50% + ${o*128}px)) scale(${o===0?1:.82}) rotate(${o*3}deg)`;p.style.opacity=Math.abs(o)>1?0:(o===0?1:.6);p.style.zIndex=10-Math.abs(o)});pd.innerHTML=data.map((_,i)=>`<i class="${i===cur?'a':''}"></i>`).join('')}
 ren();let sx=null;const go=d=>{const n=cur+d;if(n<0||n>=N)return;cur=n;tn(700,.08,'square',.05);ren()};
 car.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});car.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>30)go(dx<0?1:-1);sx=null});

 petals();$('#rl').onclick=()=>{click();next(letter)}}
// ---------- 6. LETTER ----------
function letter(){
 win('LETTER.EXE',`<div class="pad"><h2 style="font-size:24px">A Letter For You 💌</h2><p class="s">Tap the wax seal to open your special message</p><div class="env" id="env"><div class="wxw"><i class="wbk"></i><div class="wax"><b>♥</b></div></div><span id="ut">TAP TO OPEN</span></div><div class="ln">♥</div></div>`);

// ---------- 7. MESSAGE ----------
function msg(){window._o=0;$('#ovl').style.display='flex';const el=$('#mt');el.textContent='';const tx=document.createTextNode(''),cu=document.createElement('span');cu.className='cur';cu.textContent='_';el.append(tx,cu);let i=0;const ch=[...LETTER];
 (function t(){if(i>=ch.length){cu.remove();petals(true);return}tx.data+=ch[i++];el.scrollTop=el.scrollHeight;if(i%2==0)tn(1400+Math.random()*300,.02,'square',.025);setTimeout(t,32)})()}
$('#cx').onclick=()=>{$('#ovl').style.display='none';click()};
// ---------- PETALS ----------
const cv=$('#cv'),c=cv.getContext('2d');let PT=[],run=false;
const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();addEventListener('resize',rs);
function petals(big,n){for(let i=0;i<(n??(big?160:70));i++)PT.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:(Math.random()-.5)*1.2,vy:1+Math.random()*2,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.1,c:['#ffb3cf','#ff8fb8','#ffd6e8','#ffc9dc'][i%4]});if(!run){run=true;(function f(){c.clearRect(0,0,cv.width,cv.height);PT.forEach(p=>{if(p.g){p.vx*=.985;p.vy+=p.g;p.x+=p.vx}else p.x+=p.vx+Math.sin(p.y/40)*.5;p.y+=p.vy;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.beginPath();c.ellipse(0,0,p.s,p.s*.55,0,0,7);c.fill();c.restore()});PT=PT.filter(p=>p.y<cv.height+30);if(PT.length)requestAnimationFrame(f);else run=false})()}}

const PC=['#ff4f8b','#ff6b9d','#ff8fb3','#ffb3cf','#ffd0e0','#ff5c93'];
function flowers(x,y){
 if(PT.length>900)PT.length=600;
 for(let i=0;i<170;i++){const a=Math.random()*6.283,sp=3+Math.random()*10;PT.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,g:.16+Math.random()*.08,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:PC[i%6]})}
 for(let i=0;i<190;i++)PT.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.7,vx:(Math.random()-.5)*1.6,vy:1.4+Math.random()*2.6,s:5+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.14,c:PC[i%6]});
 petals(false,0)}

 navigator.vibrate&&navigator.vibrate(40);flowers(r.left+r.width/2,r.top+r.height/2)});

 $('#gn').onclick=()=>{A();click();next(pass)}}
function pass(){
 win('PASSCODE.EXE',`<div class="pad" style="gap:16px;min-height:0;padding:22px 16px 26px"><h2 style="font-size:22px">Enter Passcode</h2><div class="pb" id="pb">${'<i></i>'.repeat(CODE.length)}</div><div class="kp">${[1,2,3,4,5,6,7,8,9,'*',0,'⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div><a class="bk" id="bk">← Back to Photo</a></div>`);
 let v='',lock=false;const pb=$('#pb');
 const draw=()=>[...pb.children].forEach((b,i)=>b.textContent=i<v.length?'★':'');
 document.querySelectorAll('.kp button').forEach(b=>b.onclick=()=>{if(lock)return;const k=b.dataset.k;
  if(k==='⌫'){v=v.slice(0,-1);tn(500,.06,'square',.06)}else if(v.length<CODE.length){v+=k;tn(700+v.length*90,.07,'square',.07)}
  navigator.vibrate&&navigator.vibrate(10);draw();
  if(v.length===CODE.length){lock=true;setTimeout(()=>{if(v===CODE){chime();navigator.vibrate&&navigator.vibrate([60,40,120]);petals(false,60);next(seal)}
   else{tn(180,.35,'sawtooth',.09,0,90);navigator.vibrate&&navigator.vibrate(200);pb.classList.add('bad');setTimeout(()=>{pb.classList.remove('bad');v='';draw();lock=false},520)}},220)}});
 $('#bk').onclick=()=>{click();next(gate)}}

if('scrollRestoration' in history)history.scrollRestoration='manual';
addEventListener('pageshow',e=>{if(e.persisted)location.reload()});

gate();
